<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notes Organizer</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- HOME PAGE -->
<div id="homePage">

    <h1>📝 Notes Organizer</h1>

    <div class="topBox">

        <input
            type="text"
            id="subjectInput"
            placeholder="Enter Subject Name"
        >

        <button id="addSubjectBtn">
            Add Subject
        </button>

    </div>

    <div id="subjectsContainer"></div>

</div>



<input
    id="searchSubject"
    placeholder="🔍 Search Subject"
    onkeyup="renderSubjects()"
>



<!-- DASHBOARD -->
<div id="dashboardPage">

    <button id="backBtn">
        ⬅ Back
    </button>

    <h1 id="subjectTitle"></h1>

    <!-- ADD NOTE -->
    <div class="section">

        <h2>➕ Add Note</h2>

        <input
            type="text"
            id="noteTitle"
            placeholder="Note Title"
        >

        <textarea
            id="noteContent"
            placeholder="Write your note..."
        ></textarea>

        <button id="saveNoteBtn">
            Save Note
        </button>

    </div>

    <!-- NOTES -->
    <div class="section">

        <h2>📋 Notes</h2>


<input
    id="noteSearch"
    placeholder="🔍 Search Notes"
    onkeyup="renderNotes()"
>

        <div id="notesContainer"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
