<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notes Organizer</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- HOME -->
<div id="homePage">

    <h1>📝 Notes Organizer</h1>

    <div class="top">

        <input
            type="text"
            id="subjectInput"
            placeholder="Enter Subject"
        >

        <button id="addSubjectBtn">
            Add Subject
        </button>

    </div>

    <div id="subjects"></div>

</div>

<!-- DASHBOARD -->
<div id="dashboardPage">

    <button id="backBtn">
        ⬅ Back
    </button>

    <h1 id="dashboardTitle"></h1>

    <div class="section">

        <input
            type="text"
            id="searchInput"
            placeholder="Search Notes"
        >

    </div>

    <div class="section">

        <input
            type="text"
            id="noteTitle"
            placeholder="Note Title"
        >

        <textarea
            id="noteContent"
            placeholder="Write your note"
        ></textarea>

        <button id="saveNoteBtn">
            Save Note
        </button>

    </div>

    <div
        class="section"
        id="notesContainer"
    ></div>

</div>

<script src="script.js"></script>

</body>
</html>
